<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Python Runner</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h2 id="title-idle">Python Code <button id="run-btn" class="btn" onclick="execute()">Run</button>ner</h2>
      <h2 id="title-running" class="hide">Python Code <button id="kill-btn" class="btn" onclick="kill()" disabled>Kill</button>er</h2>
    </header>

    <main>
      <section class="pane">
        <label for="code-editor">code</label>
        <textarea id="code-editor" class="editor in-editor" placeholder="# code"></textarea>
      </section>

      <section class="pane">
        <label for="stdin-editor">stdin</label>
        <textarea id="stdin-editor" class="editor in-editor" placeholder="stdin"></textarea>
      </section>

      <section class="pane">
        <label for="stdout-editor">stdout</label>
        <textarea id="stdout-editor" class="editor out-editor" readonly></textarea>
      </section>

      <section class="pane">
        <label for="stderr-editor">stderr <output id="stderr-status"></output></label>
        <textarea id="stderr-editor" class="editor out-editor" readonly></textarea>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
