<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Python Runner</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h2 id="title-idle">
        Python Code <button id="run-btn" onclick="execute()">Run</button>ner
      </h2>
      <h2 id="title-running" class="hide">
        Python Code
        <button id="kill-btn" onclick="kill()" disabled>Kill</button>er
      </h2>
    </header>

    <main>
      <section class="editor-pane">
        <label for="in-code">code</label>
        <textarea
          id="in-code"
          placeholder="# code"
        ></textarea>
      </section>

      <section class="editor-pane">
        <label for="in-stdin">stdin</label>
        <textarea
          id="in-stdin"
          placeholder="stdin"
        ></textarea>
      </section>

      <section class="output-pane">
        <label for="out-stdout">stdout</label>
        <textarea id="out-stdout" readonly></textarea>
      </section>

      <section class="output-pane">
        <label for="out-stderr">stderr <output id="stderr-status"></output></label>
        <textarea id="out-stderr" readonly></textarea>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
